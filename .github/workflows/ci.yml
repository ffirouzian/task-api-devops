name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      DATABASE_URL: postgresql://taskuser:taskpassword@localhost:5432/taskdb


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      - name: Run Ruff
        run: |
          ruff check .


      - name: Check formatting with Black
        run: |
          black --check .


      - name: Run tests
        run: |
          pytest


      - name: Build Docker image
        run: |
          docker build -t task-api:${{ github.sha }} .


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Tag Docker image for GHCR
        run: |
          docker tag task-api:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/task-api:${{ github.sha }}


      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/task-api:${{ github.sha }}